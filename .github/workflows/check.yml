name: Check

# The consistency checks of the documents of the specification, the Examples lines, the tests of the tools, and a
# build of the site. The tools are pure Dart scripts in the /tools directory.
# Whether the examples are valid contracts is not checked here because for that the tooling is needed.
# rialto-jvm tests itself against the test contracts and the snippets of this repository,
# and runs the conformance (rialto conformance).
on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Get the dependencies of the tools
        working-directory: tools
        run: dart pub get
      - name: Check the documents
        run: dart run tools/bin/check_spec.dart
      - name: Examples lines are up to date
        run: |
          dart run tools/bin/example_links.dart
          git diff --exit-code -- spec
      - name: Tests, analysis and formatting of the tools
        working-directory: tools
        run: |
          dart test
          dart analyze
          dart format --output=none --set-exit-if-changed .

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
