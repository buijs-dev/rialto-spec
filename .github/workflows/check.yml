name: Check

# The consistency checks of the specification, with schema validation of the test contracts, the Examples lines,
# and a build of the site.
# Conformance (tools/conformance.py) does not run here yet: it needs the CLIs of rialto-jvm and rialto-dart, which come
# with their own slice-0 pull requests, and it runs in their CI against these test contracts.
on:
  push:
    branches: [ main, develop ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/check_spec.py
      - name: Examples lines are up to date
        run: |
          python3 tools/example_links.py
          git diff --exit-code -- spec

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
